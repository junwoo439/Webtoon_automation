plugins { id 'com.android.application' }

android {
    namespace 'app.toonpace'
    compileSdk 35
    defaultConfig {
        applicationId 'app.toonpace'
        minSdk 30
        targetSdk 35
        versionCode 4
        versionName '0.1.3'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes { release { minifyEnabled false } }
}

dependencies {
    // Bundled Korean OCR model. Recognition does not send screenshots to a server.
    implementation 'com.google.mlkit:text-recognition-korean:16.0.1'
}
